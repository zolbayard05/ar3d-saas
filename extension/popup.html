<!doctype html>
<html lang="mn">
  <head>
    <meta charset="utf-8" />
    <title>Realify</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="wrap">
      <div class="brand">
        <img src="icons/icon-32.png" alt="" />
        <span>Realify</span>
        <!-- Static markup, outside #app's re-rendered tree, since this bar
             stays visible across every view — popup.js's renderBrandBar()
             (called from render()) toggles [hidden] and updates the credits
             text; the click handlers are wired once at load, not per-render. -->
        <div class="brand-actions">
          <button type="button" id="nav-credits" class="brand-link" title="Кредит цэнэглэх">–</button>
          <button type="button" id="nav-models" class="brand-link" title="Миний загварууд">Загварууд</button>
        </div>
      </div>
      <div id="app"></div>
    </div>
    <script src="config.js"></script>
    <script src="lib.js"></script>
    <!-- Vendored, not a CDN <script src>: Chrome Web Store review disallows
         remotely-hosted code in an extension (same reason
         app/api/extension/models/[id]/route.ts generates its QR server-side
         instead of a client-side library that would fetch one). Must load
         before popup.js, which creates <model-viewer> elements dynamically —
         the custom element has to already be defined by then. -->
    <script src="vendor/model-viewer.min.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
